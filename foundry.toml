[profile.default]
# Our own Solidity sources only. The upstream `nconsigny/SPHINCS-`
# checkout lives under `lib/sphincs-minus/` (foundry convention for
# submodule-vendored dependencies) so forge's auto-walk of `src` does
# NOT descend into upstream's test/script/certora subtrees.
src = "solidity"
out = "out"
# `libs` are forge's "don't compile, just resolve imports" roots.
# `lib/sphincs-minus/lib` holds the upstream's nested submodules
# (account-abstraction @ v0.9.0, openzeppelin-contracts @ v5.5.0,
# forge-std). `lib/sphincs-minus/src` is upstream's Solidity — also a
# lib for us so forge doesn't try to compile it during `forge build`,
# but `forge create lib/sphincs-minus/src/SphincsAccountFactory.sol:
# SphincsAccountFactory` still resolves on demand.
libs = ["lib/sphincs-minus/lib", "lib/sphincs-minus/src"]
# Upstream `SphincsAccount.sol` is `pragma ^0.8.28` (BaseAccount + the
# v0.9 EntryPoint interfaces require it). 0.8.28 also satisfies the
# `^0.8.25` constraint on `solidity/dev/R1AccountDev.sol`, so this is
# safe for the whole repo.
solc_version = "0.8.28"
# via_ir is required by the Yul-heavy `SphincsC9Asm.sol` verifier
# (stack-too-deep with the legacy code path) and harmless for the
# straight-line account / factory contracts.
via_ir = true
optimizer = true
optimizer_runs = 200
# Forge picks these up before scanning `libs/`. Maps the upstream
# Solidity import paths (`account-abstraction/...`,
# `@openzeppelin/contracts/...`) into the nested-submodule layout.
remappings = [
  "account-abstraction/=lib/sphincs-minus/lib/account-abstraction/contracts/",
  "@openzeppelin/contracts/=lib/sphincs-minus/lib/openzeppelin-contracts/contracts/",
]
