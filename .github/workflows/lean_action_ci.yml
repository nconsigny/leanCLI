name: LeanCli CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries for native shims
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev
          # The lakefile links libcurl/libsqlite3 by the absolute path
          # /usr/lib/lib*.so (valid on Arch, the author's dev machine). On
          # Debian/Ubuntu multiarch these live under /usr/lib/x86_64-linux-gnu,
          # so symlink them to where the build expects — without touching the
          # lakefile's deliberately glibc-safe absolute-path link line.
          for lib in libcurl libsqlite3; do
            src="$(find /usr/lib -name "${lib}.so" 2>/dev/null | head -n1)"
            if [ -n "$src" ] && [ ! -e "/usr/lib/${lib}.so" ]; then
              sudo ln -s "$src" "/usr/lib/${lib}.so"
            fi
          done
      - uses: leanprover/lean-action@v1

  isolation-and-policy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries for native shims
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev
          # The lakefile links libcurl/libsqlite3 by the absolute path
          # /usr/lib/lib*.so (valid on Arch, the author's dev machine). On
          # Debian/Ubuntu multiarch these live under /usr/lib/x86_64-linux-gnu,
          # so symlink them to where the build expects — without touching the
          # lakefile's deliberately glibc-safe absolute-path link line.
          for lib in libcurl libsqlite3; do
            src="$(find /usr/lib -name "${lib}.so" 2>/dev/null | head -n1)"
            if [ -n "$src" ] && [ ! -e "/usr/lib/${lib}.so" ]; then
              sudo ln -s "$src" "/usr/lib/${lib}.so"
            fi
          done
      - uses: leanprover/lean-action@v1
      - name: CLI isolation
        run: ./ops/scripts/check_cli_isolation.sh
      - name: Privacy policy CLI
        run: ./ops/scripts/check_privacy_cli.sh

  daemon-bootstrap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries for native shims
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev
          # The lakefile links libcurl/libsqlite3 by the absolute path
          # /usr/lib/lib*.so (valid on Arch, the author's dev machine). On
          # Debian/Ubuntu multiarch these live under /usr/lib/x86_64-linux-gnu,
          # so symlink them to where the build expects — without touching the
          # lakefile's deliberately glibc-safe absolute-path link line.
          for lib in libcurl libsqlite3; do
            src="$(find /usr/lib -name "${lib}.so" 2>/dev/null | head -n1)"
            if [ -n "$src" ] && [ ! -e "/usr/lib/${lib}.so" ]; then
              sudo ln -s "$src" "/usr/lib/${lib}.so"
            fi
          done
      - uses: leanprover/lean-action@v1
      - name: Keystore daemon routing
        run: ./ops/scripts/check_m6_keystore_daemon.sh
      - name: Daemon auto-spawn and socket activation
        run: ./ops/scripts/check_m10_autospawn.sh
      - name: Daemon config file
        run: ./ops/scripts/check_daemon_config.sh

  native-helper-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries for native shims
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev
          # The lakefile links libcurl/libsqlite3 by the absolute path
          # /usr/lib/lib*.so (valid on Arch, the author's dev machine). On
          # Debian/Ubuntu multiarch these live under /usr/lib/x86_64-linux-gnu,
          # so symlink them to where the build expects — without touching the
          # lakefile's deliberately glibc-safe absolute-path link line.
          for lib in libcurl libsqlite3; do
            src="$(find /usr/lib -name "${lib}.so" 2>/dev/null | head -n1)"
            if [ -n "$src" ] && [ ! -e "/usr/lib/${lib}.so" ]; then
              sudo ln -s "$src" "/usr/lib/${lib}.so"
            fi
          done
      - uses: leanprover/lean-action@v1
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc cargo
      - name: Build HACL and RustCrypto helpers
        run: ./ops/scripts/setup_hacl.sh
      - name: Build libsecp256k1 helpers
        run: ./ops/scripts/setup_secp256k1.sh
      - name: Helper smoke tests
        run: ./ops/scripts/check_native_helpers.sh

  chain-rpc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries for native shims
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev
          # The lakefile links libcurl/libsqlite3 by the absolute path
          # /usr/lib/lib*.so (valid on Arch, the author's dev machine). On
          # Debian/Ubuntu multiarch these live under /usr/lib/x86_64-linux-gnu,
          # so symlink them to where the build expects — without touching the
          # lakefile's deliberately glibc-safe absolute-path link line.
          for lib in libcurl libsqlite3; do
            src="$(find /usr/lib -name "${lib}.so" 2>/dev/null | head -n1)"
            if [ -n "$src" ] && [ ! -e "/usr/lib/${lib}.so" ]; then
              sudo ln -s "$src" "/usr/lib/${lib}.so"
            fi
          done
      - uses: leanprover/lean-action@v1
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc cargo
      - name: Build native crypto helpers
        run: |
          ./ops/scripts/setup_hacl.sh
          ./ops/scripts/setup_secp256k1.sh
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Chain RPC and eoa.send
        run: ./ops/scripts/check_m8_chain_rpc.sh
